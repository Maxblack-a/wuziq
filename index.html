<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>墨局 · 象棋</title>
    <!-- 首页背景图预加载:不加这行的话,浏览器要等 JS 解析、React 渲染
         到 MainMenu 组件、遇到 <img> 标签那一刻才会开始下载图片——
         加上之后浏览器在解析到 <head> 这里就会跟 JS/CSS 并行去拉这张图,
         真正显示首页的时候图片往往已经下载得差不多甚至完成了,肉眼可见
         减少"打开就是一块空白/占位色,过一下才补上图"的等待感。 -->
    <link rel="preload" as="image" href="/hero-scene-v2.webp" type="image/webp" fetchpriority="high" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
